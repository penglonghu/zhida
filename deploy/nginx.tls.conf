# 知答 HTTPS 入口（配合 docker-compose.tls.yml 使用）。
# HTTP 只保留探针，其余请求 301 到 HTTPS；证书挂载到 /etc/nginx/certs/。

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # 探针走 HTTP，方便 LB / 监控直接检查
    location = /health {
        proxy_pass http://zhida:8000;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://zhida:8000;
        proxy_set_header Host $host;
    }

    # 注意：本地映射是 8443:443，浏览器请直接访问 https://localhost:8443/
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 25m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    location = / {
        try_files /chat.html =404;
    }
    location = /chat.html {
        try_files /chat.html =404;
    }

    location / {
        proxy_pass http://zhida:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式：关闭缓冲，否则破坏逐 token 输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
