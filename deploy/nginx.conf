# 知答 ZhiDa 生产入口：nginx 统一托管前端 + 反向代理 API。
# 没域名阶段先监听 80（HTTP）；将来加 HTTPS 只需加 server 443 + 证书，应用零改动。

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;   # 文档上传上限（默认 1m 会 413）

    # 前端静态文件：nginx 直接托管，不经过应用（前后端分离）
    root /usr/share/nginx/html;

    # 精确匹配优先于下面的 location /，返回聊天页
    location = / {
        try_files /chat.html =404;
    }
    location = /chat.html {
        try_files /chat.html =404;
    }

    # 其余路径（/query /stream-query /upload-doc ...）反代到 zhida 应用
    location / {
        proxy_pass http://zhida:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式：关闭缓冲，否则 nginx 攒满 buffer 才转发，破坏逐 token 输出
        proxy_buffering off;
        proxy_cache off;
        # 问答生成较慢，放宽读超时（nginx 默认 60s 可能不够）
        proxy_read_timeout 300s;
    }
}
