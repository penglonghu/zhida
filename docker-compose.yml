version: "3.8"

services:
  zhida:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 日志挂载到宿主机，容器销毁日志不丢失，审计排错必备
      - ./logs:/app/logs
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped