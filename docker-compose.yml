services:
  zhida:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Docker 内覆盖：连 compose 里的 qdrant 服务；Linux 用 CPU 推理
      QDRANT_HOST: qdrant
      EMBED_DEVICE: cpu
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models       # 嵌入模型随包挂载，不打进镜像
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
