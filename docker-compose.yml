# 所有容器统一限制 stdout 日志大小，避免 json-file 无限增长
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  zhida:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 依赖层由 scripts/build-zhida.sh 用 Dockerfile.base 构建；
        # 这里只指定应用层所基于的基础镜像。
        BASE_IMAGE: ${BASE_IMAGE:-fde-demo-zhida-base:latest}
    # 生产由 nginx 统一入口，应用不直接暴露 8000；本地调试可临时加 "8000:8000"
    env_file:
      - .env
    environment:
      # Docker 内覆盖：连 compose 里的 qdrant/redis 服务；Linux 用 CPU 推理
      QDRANT_HOST: qdrant
      EMBED_DEVICE: cpu
      # 多实例部署：会话/限流走 Redis 共享（单实例可关）
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models       # 嵌入模型随包挂载，不打进镜像
    depends_on:
      - qdrant
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant
    # 生产不对外暴露，仅 compose 内网供 zhida 访问；本地调试可临时加 "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./redis_data:/data        # RDB 持久化，容器重启不丢会话/限流计数
    # 仅 compose 内网访问，不对外暴露端口（会话与限流是应用内部状态）

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"                 # 统一入口：前端静态 + API 反代（80 端口常被宿主机已有服务占用，默认映射 8080）
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./chat.html:/usr/share/nginx/html/chat.html:ro
    depends_on:
      - zhida
    restart: unless-stopped
    logging: *default-logging
