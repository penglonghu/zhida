<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知答 ZhiDa · RAG 知识库问答</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.5/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f7f8fa;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            padding: 16px 20px;
            background: #2563eb;
            color: white;
            font-weight: 600;
        }
        .upload-area {
            padding: 14px 20px;
            border-bottom: 1px solid #eee;
            background: #fafbfc;
            display: flex;
            align-items: center;
            gap:12px;
            flex-wrap: wrap;
        }
        .upload-tip{
            font-size:13px;
            color:#666;
        }
        .kb-area {
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
            background: #f3f6fb;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .kb-area label {
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }
        .kb-area input {
            width: 180px;
            height: 36px;
            padding: 0 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .kb-area button {
            height: 36px;
            padding: 0 14px;
        }
        .kb-hint {
            font-size: 12px;
            color: #6b7280;
        }
        .chat-box {
            height: 440px;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
        }
        .msg {
            margin-bottom: 16px;
            line-height: 1.8;
        }
        .user-msg {
            text-align: right;
        }
        .user-bubble {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px 2px 10px 10px;
            max-width: 75%;
            white-space: pre-wrap;
        }
        .assistant-bubble {
            display: inline-block;
            background: #eef2ff;
            color: #374151;
            padding: 12px 14px;
            border-radius: 2px 10px 10px 10px;
            max-width: 75%;
        }
        /* markdown 标题样式，降低粗度、控制字号，不突兀 */
        .assistant-bubble h1,
        .assistant-bubble h2,
        .assistant-bubble h3,
        .assistant-bubble h4 {
            margin: 14px 0 6px;
            font-weight: 500;
            color: #111827;
            letter-spacing: 0.2px;
        }
        .assistant-bubble h1 {
            font-size: 17px;
        }
        .assistant-bubble h2 {
            font-size: 15.5px;
        }
        .assistant-bubble h3 {
            font-size: 14.5px;
        }
        .assistant-bubble h4 {
            font-size: 14px;
        }
        .assistant-bubble p {
            margin: 6px 0;
        }
        .assistant-bubble strong {
            font-weight: 600;
        }
        .assistant-bubble ul,
        .assistant-bubble ol {
            padding-left: 22px;
            margin: 6px 0;
        }
        .assistant-bubble li {
            margin: 3px 0;
        }
        .sources {
            display: block;
            max-width: 75%;
            margin-top: 10px;
            padding: 10px 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 12.5px;
            color: #4b5563;
        }
        .sources-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .source-item {
            padding: 6px 0;
            border-top: 1px solid #eef0f2;
            line-height: 1.6;
        }
        .source-item:first-of-type {
            border-top: none;
            padding-top: 0;
        }
        .source-idx {
            font-weight: 600;
            color: #2563eb;
            margin-right: 6px;
        }
        .source-meta {
            color: #6b7280;
        }
        .source-snippet {
            margin-top: 3px;
            color: #6b7280;
            white-space: pre-wrap;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .source-snippet.expanded {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }
        .source-toggle {
            margin-top: 2px;
            color: #2563eb;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }
        .citation-warning {
            display: block;
            max-width: 75%;
            margin-top: 10px;
            padding: 8px 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 12.5px;
            color: #b91c1c;
        }
        .input-area {
            padding: 16px 20px;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            min-height: 44px;
        }
        button {
            padding: 0 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        button:disabled {
            background: #93b0f0;
            cursor: not-allowed;
        }
        .clear-btn {
            background: #6b7280;
        }
        .upload-btn{
            background:#059669;
        }
        .tip {
            color: #ef4444;
            font-size: 13px;
            padding: 8px 20px;
            display: none;
        }
        .success-tip{
            color:#059669;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">知答 ZhiDa · RAG 知识库问答 (DeepSeek + 本地BGE)</div>
    <div class="tip" id="tipBox"></div>

    <div class="kb-area">
        <label for="kbInput">知识库</label>
        <input type="text" id="kbInput" list="kbList" placeholder="default" autocomplete="off">
        <datalist id="kbList"></datalist>
        <button type="button" id="kbRefreshBtn">刷新列表</button>
        <span class="kb-hint" id="kbHint">切换知识库会新开会话</span>
    </div>

    <div class="upload-area">
        <input type="file" id="fileInput" accept=".txt,.md,.pdf">
        <button class="upload-btn" id="uploadBtn">上传文档</button>
        <span class="upload-tip">支持 txt / md / pdf，上传后自动入库</span>
    </div>

    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <textarea id="questionInput" placeholder="请输入问题... Enter发送，Shift+Enter换行" rows="1"></textarea>
        <button id="sendBtn">发送</button>
        <button class="clear-btn" id="clearBtn">清空对话</button>
    </div>
</div>

<script>
// 本地 file:// 打开直连后端；生产经 nginx 访问时走同源相对路径（nginx 反代 /query 等）
const API_BASE = location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
const API_STREAM_URL = API_BASE + "/stream-query";
const API_UPLOAD_URL = API_BASE + "/upload-doc";
const API_KBS_URL = API_BASE + "/knowledge-bases";
const KB_STORAGE_KEY = "zhida_kb";

const chatBox = document.getElementById("chatBox");
const questionInput = document.getElementById("questionInput");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");
const tipBox = document.getElementById("tipBox");
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const kbInput = document.getElementById("kbInput");
const kbList = document.getElementById("kbList");
const kbRefreshBtn = document.getElementById("kbRefreshBtn");
const kbHint = document.getElementById("kbHint");

let isStreaming = false;
let isUploading = false;
let sessionId = null;   // 多轮会话ID：首次发送时生成并复用，让服务端记住上下文

function currentKb() {
    return (kbInput.value || "").trim() || "default";
}

async function loadKbs() {
    try {
        const res = await fetch(API_KBS_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const kbs = data.kbs || [];
        kbList.innerHTML = "";
        for (const kb of kbs) {
            const opt = document.createElement("option");
            opt.value = kb;
            kbList.appendChild(opt);
        }
        kbHint.textContent = `当前租户 ${kbs.length} 个知识库`;
    } catch (e) {
        console.warn("知识库列表获取失败", e);
        kbHint.textContent = "知识库列表获取失败，可直接输入";
    }
}

function switchKb() {
    const kb = currentKb();
    localStorage.setItem(KB_STORAGE_KEY, kb);
    chatBox.innerHTML = "";
    sessionId = null;   // 切库后历史上下文可能属于旧库，重新开会话
    hideTip();
    kbHint.textContent = `已切换到 ${kb}，新会话已开始`;
    loadKbs();
}

marked.setOptions({
    gfm: true,
    breaks: true,
    mangle: false,
    headerIds: false
});

// 预处理：给紧贴文字的标题标记前面加上换行，保证markdown正常解析
function preprocessMarkdown(text) {
    text = text.replace(/([^\n])(#{1,4} )/g, '$1\n$2');
    // 只处理 ** 紧贴 ASCII 标点的场景（% + 等），不碰中文，避免误拆 **北京**。
    const PUNCT = "%+/,.#$~=():;?!<>_-";
    const cls = "[" + PUNCT.replace(/[\]\\^]/g, "\\$&") + "]";
    text = text.replace(new RegExp("\\*\\*(?=" + cls + ")", "g"), " **");
    text = text.replace(new RegExp("(?<=" + cls + ")\\*\\*", "g"), "** ");
    return text;
}

function showTip(msg, isSuccess=false){
    tipBox.textContent = msg;
    tipBox.style.display = "block";
    tipBox.className = isSuccess ? "tip success-tip" : "tip";
}
function hideTip(){
    tipBox.style.display = "none";
}
function setSendEnable(enable) {
    sendBtn.disabled = !enable;
    isStreaming = !enable;
}
function setUploadEnable(enable){
    uploadBtn.disabled = !enable;
    isUploading = !enable;
}
function escapeHtml(str) {
    return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
function appendUserMsg(text) {
    const div = document.createElement("div");
    div.className = "msg user-msg";
    div.innerHTML = `<div class="user-bubble">${escapeHtml(text)}</div>`;
    chatBox.appendChild(div);
    scrollBottom();
}
function createAssistantBubble() {
    const wrapper = document.createElement("div");
    wrapper.className = "msg";
    const bubble = document.createElement("div");
    bubble.className = "assistant-bubble";
    wrapper.appendChild(bubble);
    chatBox.appendChild(wrapper);
    scrollBottom();
    return wrapper;
}
function renderSources(wrapper, sources) {
    if (!sources || sources.length === 0) return;
    const box = document.createElement("div");
    box.className = "sources";
    const title = document.createElement("div");
    title.className = "sources-title";
    title.textContent = "参考来源";
    box.appendChild(title);
    for (const s of sources) {
        const item = document.createElement("div");
        item.className = "source-item";
        const idx = document.createElement("span");
        idx.className = "source-idx";
        idx.textContent = `[${s.index}]`;
        const meta = document.createElement("span");
        meta.className = "source-meta";
        meta.textContent = `${s.doc_name || "未知文档"} · 第${s.chunk_index + 1}段`;
        const snippet = document.createElement("div");
        snippet.className = "source-snippet";
        snippet.textContent = s.text;
        item.appendChild(idx);
        item.appendChild(meta);
        item.appendChild(snippet);
        box.appendChild(item);
    }
    wrapper.appendChild(box);
    // 追加到 DOM 后才能测实际高度：超过 3 行才给「展开/收起」按钮
    box.querySelectorAll(".source-snippet").forEach(snippet => {
        if (snippet.scrollHeight > snippet.clientHeight + 1) {
            const toggle = document.createElement("div");
            toggle.className = "source-toggle";
            toggle.textContent = "展开 ▾";
            toggle.addEventListener("click", () => {
                const expanded = snippet.classList.toggle("expanded");
                toggle.textContent = expanded ? "收起 ▴" : "展开 ▾";
            });
            snippet.insertAdjacentElement("afterend", toggle);
        }
    });
    scrollBottom();
}
function renderCitationFixed(wrapper, removed) {
    if (!removed || removed.length === 0) return;
    const box = document.createElement("div");
    box.className = "citation-warning";
    box.textContent = `已移除 ${removed.length} 处无依据引用：[${removed.map(n => `[${n}]`).join("、")}]`;
    wrapper.appendChild(box);
    scrollBottom();
}
function scrollBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function uploadFile(){
    hideTip();
    const file = fileInput.files[0];
    if(!file){
        showTip("请先选择文件");
        return;
    }
    const MAX_SIZE = 20 * 1024 * 1024;
    if(file.size > MAX_SIZE){
        showTip("文件不能超过20MB");
        return;
    }
    setUploadEnable(false);
    const formData = new FormData();
    formData.append("file", file);
    formData.append("kb_id", currentKb());
    try{
        const res = await fetch(API_UPLOAD_URL, {
            method:"POST",
            body: formData
        });
        const data = await res.json();
        if(!res.ok){
            throw new Error(data.detail || "上传失败");
        }
        showTip(`✅ 上传成功（知识库：${currentKb()}），chunk数量：${data.chunk_count}`, true);
        fileInput.value = "";
        loadKbs();
    }catch(e){
        console.error(e);
        showTip("上传异常：" + e.message);
    }finally{
        setUploadEnable(true);
    }
}

async function sendQuestion() {
    hideTip();
    const q = questionInput.value.trim();
    if (!q) return;

    appendUserMsg(q);
    questionInput.value = "";
    setSendEnable(false);

    const wrapperDom = createAssistantBubble();
    const bubbleDom = wrapperDom.querySelector(".assistant-bubble");
    let fullText = "";
    let sources = [];
    let removed = [];
    let fixedAnswer = null;

    try {
        if (!sessionId) {
            sessionId = crypto.randomUUID();
        }
        const resp = await fetch(API_STREAM_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "accept": "*/*"
            },
            body: JSON.stringify({
                question: q,
                session_id: sessionId,
                kb_id: currentKb(),
                temperature: 0.1
            })
        });

        if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`);
        }
        if (!resp.body) {
            throw new Error("浏览器不支持ReadableStream");
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const blocks = buffer.split("\n\n");
            buffer = blocks.pop() ?? "";

            for (const block of blocks) {
                if (!block.trim()) continue;
                if (!block.startsWith("data: ")) continue;
                const payload = block.slice("data: ".length);
                if (payload === "[DONE]") break;

                const parsed = JSON.parse(payload);
                if (typeof parsed === "string") {
                    fullText += parsed;
                    const fixed = preprocessMarkdown(fullText);
                    const html = marked.parse(fixed);
                    bubbleDom.innerHTML = DOMPurify.sanitize(html);
                    scrollBottom();
                } else if (parsed && parsed.type === "sources") {
                    sources = parsed.sources;
                } else if (parsed && parsed.type === "citation_fixed") {
                    removed = parsed.removed || [];
                    fixedAnswer = parsed.fixed || null;
                }
            }
        }
        if (fixedAnswer) {
            // 校验即修正：用去掉无依据引用句后的版本替换整个气泡
            const fixed = preprocessMarkdown(fixedAnswer);
            bubbleDom.innerHTML = DOMPurify.sanitize(marked.parse(fixed));
            scrollBottom();
        }
        renderSources(wrapperDom, sources);
        renderCitationFixed(wrapperDom, removed);
    } catch (err) {
        console.error(err);
        showTip("请求异常：" + err.message);
        bubbleDom.textContent += "\n[流式中断]";
    } finally {
        setSendEnable(true);
    }
}

sendBtn.addEventListener("click", sendQuestion);
uploadBtn.addEventListener("click", uploadFile);
kbInput.value = localStorage.getItem(KB_STORAGE_KEY) || "default";
kbInput.addEventListener("change", switchKb);
kbInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        kbInput.blur();   // 触发 change，切换知识库
    }
});
kbRefreshBtn.addEventListener("click", loadKbs);
loadKbs();

questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
    }
});
clearBtn.addEventListener("click", () => {
    chatBox.innerHTML = "";
    sessionId = null;   // 清空后重新开一轮对话
    hideTip();
});
</script>
</body>
</html>
