# 持续集成：静态检查 + 语法门禁 + 离线导入冒烟
#
# 为什么 CI 用 Python 3.13 而不是 3.14：
#   本地开发/镜像是 3.14（见 README / Dockerfile），但 GitHub Actions runner
#   不保证已提供 3.14，故 CI 固定 3.13 做兼容性验证（代码需同时兼容 3.13/3.14）。
# 为什么只做导入冒烟而不跑完整测试：
#   tests/ 下目前只有 test_llm.py，它会真实调用 LLM 网关，不能进 CI；
#   且 CI 不安装 torch / sentence-transformers（体积大、CI 不需要），
#   所以只验证「轻量模块导入不炸 + 全仓库语法可编译」。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时取消旧任务，省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-smoke:
    name: 静态检查与导入冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装开发依赖（ruff / pytest，不含 torch）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装冒烟测试所需的最小运行时依赖
        # 只装 import 冒烟需要的纯 Python 小包，版本与 requirements.txt 保持一致；
        # 不装 torch / sentence-transformers，保证 CI 快速跑完。
        run: |
          pip install --no-cache-dir \
            "pydantic-settings==2.16.2" \
            "python-dotenv==1.2.4" \
            "prometheus-client==0.26.0" \
            "pypdf==6.21.2"

      - name: 静态检查（ruff）
        run: ruff check .

      - name: 语法门禁（compileall）
        run: python -m compileall -q core scripts main.py config.py schemas.py

      - name: 离线导入冒烟
        # config.py 在 import 时即校验必填配置，这里给假值，只验证「导入不炸」；
        # 不连接任何外部服务（LLM / Qdrant / Redis 均不会被真正调用）。
        env:
          LLM_API_URL: "http://127.0.0.1:9/v1"
          LLM_API_KEY: "ci-dummy-key-not-used"
        run: |
          python -c "import config, schemas"
          python -c "import core.bm25, core.auth, core.tracing, core.metrics, core.conversation, core.doc_parser"
          echo "离线导入冒烟通过"
